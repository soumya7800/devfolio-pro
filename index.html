  <script>
    window.process = window.process || { env: { NODE_ENV: 'development' } };

    window.addEventListener('error', function (e) {
      if (document.body && document.body.innerHTML.trim() === '') {
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#aa0000;color:white;padding:20px;z-index:99999;font-family:monospace';

        document.body.appendChild(errDiv);

              'pointer-events': 'none',
              'z-index': '1',
              'border-radius': 'inherit',
            },
            '.glass-noise': {
              'position': 'relative',
            },
            '.glass-noise::after': {
              'content': '""',
              'position': 'absolute',
              'inset': '0',
              'background-image': 'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'n\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\' opacity=\'0.4\'/%3E%3C/svg%3E")',
              'opacity': '0.025',
              'mix-blend-mode': 'overlay',
              'pointer-events': 'none',
              'z-index': '0',
              'border-radius': 'inherit',
            },
            '.spin-border': {
              'position': 'relative',
              'overflow': 'hidden',
              'z-index': '1',
            },
            '.spin-border::before': {
              'content': '""',
              'position': 'absolute',
              'top': '-100%',
              'left': '-100%',
              'width': '300%',
              'height': '300%',
              'background': 'conic-gradient(transparent, rgba(61,219,255,0.8), transparent 25%)',
              'animation': 'spinSweep 3s linear infinite',
              'z-index': '-2',
            },
            '.spin-border::after': {
              'content': '""',
              'position': 'absolute',
              'inset': '1.5px',

              'z-index': '-1',
            },
            '.chip': {

            },

              'border': '1px solid rgba(61,219,255,0.35)',

  </script>
  <style>
    :root {
      --accent-rgb: 61, 219, 255;
      --accent-sec-rgb: 139, 111, 255;
      --accent-warm-rgb: 255, 107, 157;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: #070B14;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #070B14; }
    ::-webkit-scrollbar-thumb { background: rgba(61,219,255,0.3); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(61,219,255,0.55); }

    /* Dot Grid */
    .dot-grid {
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Reveal animations */
    .reveal {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s cubic-bezier(0.2,0.8,0.2,1), transform 0.5s cubic-bezier(0.2,0.8,0.2,1);
    }
    .reveal.active { opacity: 1; transform: translateY(0); }

    /* Gradient border technique */
    .grad-border {
      position: relative;
      border-radius: 20px;
    }
    .grad-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 21px;
      background: linear-gradient(135deg, rgba(61,219,255,0.25) 0%, rgba(139,111,255,0.15) 50%, rgba(255,255,255,0.05) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* Shimmer on a card */
    .shimmer-card {
      position: relative;
      overflow: hidden;
    }
    .shimmer-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 60%; height: 100%;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
      animation: shimmer 3s linear infinite;
      pointer-events: none;
    }

    /* Glow orbs — brighter for visible background life */
    .orb { pointer-events: none; border-radius: 50%; filter: blur(80px); position: absolute; }
    .orb-1 { width: 700px; height: 700px; background: rgba(61,219,255,0.18); animation: blobDrift 18s ease-in-out infinite; }
    .orb-2 { width: 600px; height: 600px; background: rgba(139,111,255,0.16); animation: blobDrift2 22s ease-in-out infinite; }
    .orb-3 { width: 500px; height: 500px; background: rgba(255,107,157,0.10); animation: blobDrift3 16s ease-in-out infinite; }

    /* Fix: section-label must be inline, not block */
    .section-label {
      display: inline-flex !important;
      width: fit-content !important;
      align-items: center;
      gap: 0.5rem;
      padding: 0.28rem 0.9rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(61,219,255,0.09);
      border: 1px solid rgba(61,219,255,0.25);
      color: #3DDBFF;
    }

    /* Futuristic scan-line overlay */
    .scan-overlay {
      background: repeating-linear-gradient(
        180deg,
        transparent,
        transparent 3px,
        rgba(61,219,255,0.012) 3px,
        rgba(61,219,255,0.012) 4px
      );
      pointer-events: none;
    }

    /* Hex grid background */
    .hex-grid {
      background-image:
        linear-gradient(rgba(61,219,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,219,255,0.04) 1px, transparent 1px),
        linear-gradient(rgba(61,219,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,219,255,0.02) 1px, transparent 1px);
      background-size: 120px 120px, 120px 120px, 30px 30px, 30px 30px;
      background-position: -1px -1px, -1px -1px, -0.5px -0.5px, -0.5px -0.5px;
    }

    /* Corner bracket decoration */
    .corner-tl::before, .corner-br::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      pointer-events: none;
    }
    .corner-tl::before {
      top: 10px; left: 10px;
      border-top: 1.5px solid rgba(61,219,255,0.4);
      border-left: 1.5px solid rgba(61,219,255,0.4);
    }
    .corner-br::after {
      bottom: 10px; right: 10px;
      border-bottom: 1.5px solid rgba(61,219,255,0.4);
      border-right: 1.5px solid rgba(61,219,255,0.4);
    }

    /* Neon glow text */
    .text-neon {
      text-shadow: 0 0 20px rgba(61,219,255,0.5), 0 0 60px rgba(61,219,255,0.2);
    }
    .text-neon-sec {
      text-shadow: 0 0 20px rgba(139,111,255,0.5), 0 0 60px rgba(139,111,255,0.2);
    }

    /* Glowing border line animation */
    @keyframes borderGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(61,219,255,0.2), inset 0 0 8px rgba(61,219,255,0.02); }
      50% { box-shadow: 0 0 20px rgba(61,219,255,0.4), inset 0 0 15px rgba(61,219,255,0.05); }
    }
    .border-glow-animate {
      animation: borderGlow 3s ease-in-out infinite;
    }

    /* Glow text selection */
    ::selection { background: rgba(61,219,255,0.25); color: #fff; }
  </style>
